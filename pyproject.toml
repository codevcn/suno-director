[project]
name = "music-director"
version = "0.1.0"
description = "AI Music-Production Framework with SONG-SPEC SSOT, credit-guarded Suno MCP execution, and structured diagnosis feedback loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
