spec_version: "1.0"
revision: 1

identity:
  title: "Neon Last Train"
  language: "en"
  concept: "Missing the second-to-last commuter train on a rainy Tokyo night and choosing to watch the city lights instead of rushing."
  intent: "Deliver bittersweet nocturnal release as the chorus opens above tight city-pop groove."
  target_duration_seconds: 210

creative_direction:
  genre:
    - "1980s Japanese city pop"
    - "boogie R&B"
  subgenre:
    - "urban night pop"
  mood:
    - "bittersweet"
    - "nocturnal"
    - "nostalgic"
  reference_notes:
    - "Borrow tight slap/fingered bass pocket and Rhodes warmth; original melody and lyrics"
  avoid:
    - "EDM drop"
    - "trap hi-hats"
    - "modern sidechain pumping"
    - "fade out ending"

music:
