  mix_intent:
    focal_element: "lead_vocal"
    width_contrast: "tight verse pocket opening wide on stereo synth brass in chorus"
    depth_note: "upfront crisp female vocal, warm tape-saturated backing band"
    mood_priority: "bittersweet nocturnal city pop groove"

vocal:
  enabled: true
  singer_count: 1
  register: "mezzo-soprano"
  timbre: "clear silky tone with light breathy edge"
  delivery: "conversational intimacy in verses, soaring legato lift in choruses"
  section_direction:
    verse_1: "close mic, gentle wistful phrasing"
    pre_chorus: "rising tension, clipped phrasing"
    chorus_1: "open chest voice, stacked backing harmonies"
    verse_2: "warmer rhythmic confidence"
    chorus_2: "bright layered harmonies"
    chorus_3: "soaring peak with octave ad-libs"

lyrics:
  language: "en"
  text: |
    [Intro]

    [Verse 1 - intimate, close vocal]
    Raindrops trace the neon on the platform glass
    Zero-zero-fifteen, watching shadows pass
    Ticket in my coat pocket, ink begins to blur
    Counting every footstep where we never were

    [Pre-Chorus - rising tension]
    Yellow warning lights blink along the track
    Once the doors slide shut, there is no turning back

    [Chorus - open, layered harmonies]
    Ride the neon last train through the midnight glow
    Every streetlamp flickers like a silent show
    I let go of yesterday at the station gate
    Maybe missing one train means I am right on time, not late

    [Verse 2 - rhythmic groove]
    Vending machine hums a soft electric tune
    Reflections on the river catch a silver moon
    Empty wooden bench feels lighter than before
    Someone else's laughter fades behind the door

    [Chorus - bright, energetic]
    Ride the neon last train through the midnight glow
    Every streetlamp flickers like a silent show
    I let go of yesterday at the station gate
    Maybe missing one train means I am right on time, not late

    [Bridge - instrumental sax solo]

    [Chorus - soaring ad-libs]
    Ride the neon last train through the midnight glow
    Every streetlamp flickers like a silent show
    I let go of yesterday at the station gate
    Maybe missing one train means I am right on time, not late

    [Outro - clean saxophone tail]
  rhyme_strategy: "AABB in verses, AABB with internal assonance in chorus"
  prosody_notes:
    - "Keep verse lines 9-11 syllables to sit cleanly in 108 BPM pocket"
    - "Spell out 00:15 as 'Zero-zero-fifteen' for unambiguous singing"
  pronunciation_overrides:
    - term: "00:15"
      phonetic: "Zero-zero-fifteen"
      reason: "Avoid Suno misreading colon time format"

generation:
  backend: "suno"
  intent: "create"
  model_preference: "auto"
  style_prompt: "Female mezzo-soprano vocal with silky clear tone and wistful phrasing. 1980s Japanese city pop, bittersweet nocturnal groove, 108 BPM, F# minor, fingered and popped electric bass playing slightly ahead of the beat, stereo Rhodes electric piano, 16th-note muted clean guitar, gated reverb snare, analog synth brass in chorus, warm tenor saxophone solo in bridge, warm tape saturation, clean band stop ending"
  exclude_styles:
    - "EDM drop"
    - "trap hi-hats"
    - "modern sidechain pumping"
    - "fade out ending"
  source:
    audio_id: null
    continue_at: null
  controls:
    variety: 0
    max_mode: false

execution_policy:
  confirmation_mode: "per_cycle"
  approved_song_credit_budget: 0
  approved_download_credit_budget: 0
  allow_auto_iteration: false

acceptance:
  must:
    - "chorus has clear lift above verse and pre-chorus"
    - "all written lyrics are sung cleanly without skipping lines"
    - "tenor saxophone bridge solo is audible"
    - "clean ending without fade out"
  should:
    - "tempo stays near 108 BPM with tight bass pocket"
  reject_if:
    - "chorus sounds flat or same energy as verse"
    - "modern trap hi-hats or EDM drop appear"

status:
  phase: "validated"
  selected_take_id: null
