    tonic: "F#"
    mode: "minor"
  tempo_bpm: 108
  meter: "4/4"

  harmony:
    global_intent: "Classic city-pop major-7th and dominant-9th suspensions with a lifted key-color shift in the bridge."
    sections:
      intro:
        roman: "| IVmaj7 | V7sus4 | IIIm7 | VIm7 |"
        chords: "| Dmaj7 | E7sus4 | C#m7 | F#m7 |"
      verse_1:
        roman: "| IIm7 | V9 | Imaj7 | VIm7 | IIm7 | V7sus4 | IIIm7 | VI7 |"
        chords: "| G#m7 | C#9 | F#m7 | Dmaj7 | G#m7 | C#7sus4 | Amaj7 | Dmaj7 |"
      pre_chorus:
        roman: "| IVmaj7 | V/V | IIIm7 | VI7 |"
        chords: "| Dmaj7 | G#7 | C#m7 | F#7 |"
      chorus_1:
        roman: "| IVmaj7 | V7 | IIIm7 | VIm7 | IIm7 | V9 | Imaj7 | V7/IV |"
        chords: "| Dmaj7 | E7 | C#m7 | F#m7 | Bm7 | E9 | Amaj7 | A7 |"
      verse_2:
        roman: "| IIm7 | V9 | Imaj7 | VIm7 | IIm7 | V7sus4 | IIIm7 | VI7 |"
        chords: "| G#m7 | C#9 | F#m7 | Dmaj7 | G#m7 | C#7sus4 | Amaj7 | Dmaj7 |"
      chorus_2:
        roman: "| IVmaj7 | V7 | IIIm7 | VIm7 | IIm7 | V9 | Imaj7 | V7/IV |"
        chords: "| Dmaj7 | E7 | C#m7 | F#m7 | Bm7 | E9 | Amaj7 | A7 |"
      bridge:
        roman: "| bVImaj7 | bVII7 | IIIm7 | bIIIm7 | IIm7 | V7sus4 |"
        chords: "| Dmaj7 | E7 | C#m7 | Cm7 | Bm7 | E7sus4 |"
        color_note: "Chromatic passing Cm7 softens tension before the saxophone solo handoff"
      chorus_3:
        roman: "| IVmaj7 | V7 | IIIm7 | VIm7 | IIm7 | V9 | Imaj7 | IVmaj7 |"
        chords: "| Dmaj7 | E7 | C#m7 | F#m7 | Bm7 | E9 | Amaj7 | Dmaj7 |"
      outro:
        roman: "| IVmaj7 | V7 | IIIm7 | VIm9 |"
        chords: "| Dmaj7 | E7 | C#m7 | F#m9 |"

  melody:
    range: "A3-E5"
    motif: "Syncopated four-note pickup rising a fifth on the chorus downbeat"
    contour: "restrained mid-register verses exploding into sustained upper-chest chorus hooks"
    peak_strategy: "Save E5 sustained belt for Chorus 3 final hook repeat"

