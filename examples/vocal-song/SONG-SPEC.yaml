  - id: "intro"
    name: "Intro"
    bars: 6
    energy: 32
    function: "Establish Rhodes chords, muted guitar 16ths, and gated snare pickup"
  - id: "verse_1"
    name: "Verse"
    bars: 16
    energy: 40
    function: "Intimate train-platform scene with tight bass pocket"
  - id: "pre_chorus"
    name: "Pre-Chorus"
    bars: 6
    energy: 58
    function: "Drop kick for 2 bars at tail before chorus lift"
  - id: "chorus_1"
    name: "Chorus"
    bars: 16
    energy: 86
    function: "Full city-pop chorus with analog brass stabs and stacked backing harmonies"
  - id: "verse_2"
    name: "Verse"
    bars: 14
    energy: 48
    function: "Richer percussive guitar comping and Rhodes counter-fills"
  - id: "chorus_2"
    name: "Chorus"
    bars: 16
    energy: 88
    function: "Second chorus maintains lift with added synth sparkle"
  - id: "bridge"
    name: "Bridge"
    bars: 10
    energy: 50
    function: "Strip rhythm guitar, open space for expressive tenor saxophone solo"
  - id: "chorus_3"
    name: "Chorus"
    bars: 16
    energy: 94
    function: "Final chorus peak with ad-lib octave harmonies"
  - id: "outro"
    name: "Outro"
    bars: 6
    energy: 38
