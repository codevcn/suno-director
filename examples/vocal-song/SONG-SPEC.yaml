      technique: "pre_chorus_drum_drop"
      note: "Mute drums for the last bar of pre-chorus before gated snare fill into chorus"
    - before_section: "bridge"
      technique: "texture_strip"
      note: "Pull back synth brass and clean guitar so tenor sax steps upfront"
    - before_section: "outro"
      technique: "clean_stop"
      note: "Tight band cadence ending cleanly on F#m9 without fading"
  energy_curve:
