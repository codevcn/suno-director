# Capability Normalization Rules & Credit Cost Reference
# Runtime `account-usage` response is always the live authority.
# Note (verified live on 2026-11-22): Free accounts may list "controls.advanced" in
# account-usage.features while audio-create rejects sliders/negative_style/max_mode
# with 403 feature_not_on_plan; execution_guard enforces plan != "free" for those flags.

model_resolution_priority:
  - v6
  - v6-wild
  - v6-mini

credit_costs:
  create:
    song_credits: 10
    download_credits: 0
    outputs: 2
    max_mode_multiplier: 2
  cover:
    song_credits: 10
    download_credits: 0
    outputs: 2
    max_mode_multiplier: 2
  extend:
    song_credits: 10
    download_credits: 0
    outputs: 2
    max_mode_multiplier: 2
  edit:
    song_credits: 10
    download_credits: 0
    outputs: 2
    max_mode_multiplier: 1
  download:
    song_credits: 0
    download_credits: 1
    outputs: 1

feature_gates:
  advanced_controls: "controls.advanced"
  cover: "generate.cover"
  extend: "generate.extend"
  simple: "generate.simple"
  custom: "generate.custom"
  download: "audio.download"
