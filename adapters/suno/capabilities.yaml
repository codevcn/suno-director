# Capability Normalization Rules & Credit Cost Reference
# Runtime `account-usage` response is always the live authority.
# Layering: declared capability -> live account-usage -> runtime_overrides -> effective capability.

model_resolution_priority:
  - v6
  - v6-wild
  - v6-mini

credit_costs:
  create:
    song_credits: 10
    download_credits: 0
    outputs: 2
    max_mode_multiplier: 2
  cover:
    song_credits: 10
    download_credits: 0
    outputs: 2
    max_mode_multiplier: 2
  extend:
    song_credits: 10
    download_credits: 0
    outputs: 2
    max_mode_multiplier: 2
  edit:
    song_credits: 10
    download_credits: 0
    outputs: 2
    max_mode_multiplier: 1
  download:
    song_credits: 0
    download_credits: 1
    outputs: 1

feature_gates:
  advanced_controls: "controls.advanced"
  cover: "generate.cover"
  extend: "generate.extend"
  simple: "generate.simple"
  custom: "generate.custom"
  download: "audio.download"

# Observed backend compatibility overrides layered AFTER account-usage.
# Remove an entry here if a live run confirms Suno enabled it for that plan/model.
runtime_overrides:
  free:
    v6-mini:
      exclude_styles:
        effective: false
        evidence: "403 feature_not_on_plan (excluded styles) despite controls.advanced in account-usage.features"
        observed_at: "2026-11-22"
      sliders:
        effective: false
        evidence: "403 feature_not_on_plan (sliders) despite controls.advanced in account-usage.features"
        observed_at: "2026-11-22"
