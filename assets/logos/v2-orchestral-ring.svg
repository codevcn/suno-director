      <g stroke="black" stroke-width="2.8" stroke-linecap="round">
        <line x1="44" y1="53.5" x2="44" y2="46.5"/>
        <line x1="50" y1="57" x2="50" y2="43"/>
        <line x1="56" y1="53.5" x2="56" y2="46.5"/>
