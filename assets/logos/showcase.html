<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Director — Logo Concepts Showcase (8 Variants)</title>
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #131722;
      --border: #23293a;
      --text: #eef1f7;
      --muted: #93a0b8;
      --accent: #f59e0b;
    }
    body.theme-light {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --border: #e2e6ef;
      --text: #111827;
      --muted: #5b6476;
    }
    body.theme-editorial {
      --bg: #f4efe6;
      --surface: #fbf8f3;
      --border: #dfd6c7;
      --text: #1f1b16;
      --muted: #6c6257;
    }
    body.theme-fluid {
      --bg: radial-gradient(circle at 20% 20%, #1c1942 0%, #090b16 70%);
      --surface: rgba(21, 25, 45, 0.86);
      --border: rgba(124, 140, 255, 0.22);
      --text: #f3f5ff;
      --muted: #9ea8d6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.25s ease, color 0.25s ease;
    }
    .container { max-width: 1240px; margin: 0 auto; padding: 36px 24px 64px; }
    header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end;
      gap: 20px; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -0.02em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 14px; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
      background: var(--surface); border: 1px solid var(--border); padding: 12px 16px; border-radius: 12px;
    }
    .control-group { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    button.pill {
      background: transparent; color: var(--text); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500;
    }
    button.pill.active { border-color: var(--accent); color: var(--accent); background: rgba(245, 158, 11, 0.1); }
    .swatch {
      width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
    }
    .swatch.active { border-color: var(--text); transform: scale(1.1); }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(275px, 1fr)); gap: 18px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 20px; display: flex; flex-direction: column; gap: 14px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .card-head { display: flex; justify-content: space-between; align-items: center; }
    .tag {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--accent); background: rgba(245, 158, 11, 0.12); padding: 3px 8px; border-radius: 999px;
    }
    .preview-stage {
      height: 152px; border-radius: 12px; border: 1px dashed var(--border);
      display: flex; align-items: center; justify-content: center; gap: 16px;
      color: var(--accent);
    }
    .preview-stage svg { transition: width 0.2s ease, height 0.2s ease; }
    .lockup {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 10px; border: 1px solid var(--border); font-weight: 650; font-size: 15px;
    }
    .lockup svg { width: 24px; height: 24px; color: var(--accent); flex-shrink: 0; }
    .size-strip {
      display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 11px;
    }
    .size-box { display: flex; align-items: center; gap: 4px; color: var(--text); }
    h2 { margin: 0; font-size: 17px; }
    p.desc { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; flex: 1; }
    .actions { display: flex; gap: 8px; }
    .actions button {
      flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--text); cursor: pointer; font-size: 12px; font-weight: 600;
    }
    .actions button:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Music Director — Logo Concepts (V1–V8)</h1>
        <p class="subtitle">SVG <code>viewBox="0 0 100 100"</code> với <code>currentColor</code> — sẵn sàng xuất PNG / Windows <code>.ico</code> cho CLI &amp; Inno Setup</p>
      </div>
      <div class="controls">
        <div class="control-group">
          <span>Nền:</span>
          <button class="pill active" onclick="setTheme('dark', this)">Void</button>
          <button class="pill" onclick="setTheme('fluid', this)">Fluid</button>
          <button class="pill" onclick="setTheme('editorial', this)">Editorial</button>
          <button class="pill" onclick="setTheme('light', this)">Swiss</button>
        </div>
        <div class="control-group">
          <span>Màu:</span>
          <span class="swatch active" style="background:#f59e0b" onclick="setColor('#f59e0b', this)" title="Studio Amber"></span>
          <span class="swatch" style="background:#38bdf8" onclick="setColor('#38bdf8', this)" title="Cyan Pulse"></span>
          <span class="swatch" style="background:#818cf8" onclick="setColor('#818cf8', this)" title="Indigo Synth"></span>
          <span class="swatch" style="background:#10b981" onclick="setColor('#10b981', this)" title="Guard Emerald"></span>
          <span class="swatch" style="background:#e5e7eb" onclick="setColor('#e5e7eb', this)" title="Mono Light"></span>
          <span class="swatch" style="background:#111827" onclick="setColor('#111827', this)" title="Mono Dark"></span>
        </div>
        <div class="control-group">
          <span>Cỡ chính:</span>
          <button class="pill" onclick="setMainSize(48, this)">48px</button>
          <button class="pill active" onclick="setMainSize(88, this)">88px</button>
          <button class="pill" onclick="setMainSize(116, this)">116px</button>
        </div>
      </div>
    </header>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    const VARIANTS = [
      {
        id: 'v1-baton-pulse',
        name: 'V1 — Baton Pulse',
        tag: 'Conductor + Equalizer',
        desc: 'Gậy chỉ huy (baton) vươn lên xuyên qua 5 thanh nhịp đối xứng hình chữ M. Rõ nghĩa "Music Director" ngay cái nhìn đầu tiên.',
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><g stroke="currentColor" stroke-width="6.5" stroke-linecap="round"><line x1="20" y1="74" x2="20" y2="34"/><line x1="35" y1="66" x2="35" y2="24"/><line x1="50" y1="78" x2="50" y2="46"/><line x1="65" y1="66" x2="65" y2="24"/><line x1="80" y1="74" x2="80" y2="38"/></g><line x1="16" y1="78" x2="84" y2="18" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><circle cx="84" cy="18" r="5.5" fill="currentColor"/></svg>`
      },
      {
        id: 'v2-orchestral-ring',
        name: 'V2 — Orchestral Ring',
        tag: '8-Skill Architecture',
        desc: 'Tâm SONG-SPEC SSOT chứa sóng âm âm bản bao quanh bởi đúng 8 node tượng trưng 8 core skills không chồng lấn.',
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><defs><mask id="m2"><rect width="100" height="100" fill="white"/><g stroke="black" stroke-width="2.8" stroke-linecap="round"><line x1="44" y1="53.5" x2="44" y2="46.5"/><line x1="50" y1="57" x2="50" y2="43"/><line x1="56" y1="53.5" x2="56" y2="46.5"/></g></mask></defs><circle cx="50" cy="50" r="32" stroke="currentColor" stroke-width="3" stroke-dasharray="14 6"/><circle cx="50" cy="50" r="14.5" fill="currentColor" mask="url(#m2)"/><g fill="currentColor"><circle cx="50" cy="12" r="4.5"/><circle cx="76.9" cy="23.1" r="4.5"/><circle cx="88" cy="50" r="4.5"/><circle cx="76.9" cy="76.9" r="4.5"/><circle cx="50" cy="88" r="4.5"/><circle cx="23.1" cy="76.9" r="4.5"/><circle cx="12" cy="50" r="4.5"/><circle cx="23.1" cy="23.1" r="4.5"/></g></svg>`
      },
      {
        id: 'v3-guarded-crest',
        name: 'V3 — Guarded Crest',
        tag: 'Execution Guard',
        desc: 'Khiên Execution Guard bảo vệ credit kết hợp đường xung sóng tương phản cao. Rất hợp cho app/installer icon trên Windows.',
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><path d="M50 10 L84 22 V50 C84 70 69 83 50 90 C31 83 16 70 16 50 V22 Z" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><path d="M27 58 H36 L43 38 L52 63 L61 31 L67 52 H73" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      },
      {
        id: 'v4-closed-loop-m',
        name: 'V4 — Closed-Loop M',
        tag: 'Feedback Monogram',
        desc: 'Monogram chữ M sắc gọn khép thành vòng phản hồi Diagnosis -> Spec Revision, 3 đỉnh node rõ nét kể cả ở 16px favicon.',
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><path d="M20 74 V30 L50 56 L80 30 V74" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 74 C36 86 64 86 80 74" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/><g fill="currentColor"><circle cx="20" cy="26" r="5"/><circle cx="50" cy="56" r="6"/><circle cx="80" cy="26" r="5"/></g></svg>`
      },
      {
        id: 'v5-harmonic-matrix',
        name: 'V5 — Harmonic Matrix',
        tag: 'AI Energy Curve',
        desc: 'Ma trận chấm tròn thể hiện energy_curve: Intro -> Verse -> Pre-drop -> Chorus Peak -> Clean Stop. Phong cách công nghệ AI-native.',
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor"><circle cx="18" cy="72" r="4"/><circle cx="18" cy="58" r="4"/><circle cx="34" cy="72" r="4"/><circle cx="34" cy="58" r="4"/><circle cx="34" cy="44" r="4"/><circle cx="50" cy="72" r="4"/><circle cx="50" cy="58" r="4"/><circle cx="66" cy="72" r="4"/><circle cx="66" cy="58" r="4"/><circle cx="66" cy="44" r="4"/><circle cx="66" cy="30" r="4"/><circle cx="66" cy="16" r="4.5"/><circle cx="82" cy="72" r="4"/><circle cx="82" cy="58" r="4"/><circle cx="82" cy="44" r="4"/><path d="M18 50 L34 36 L50 50 L66 16 L82 36" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/></svg>`
      },
      {
        id: 'v6-cli-mixer',
        name: 'V6 — CLI Tag Mixer',
        tag: 'CLI & Metatags',
        desc: 'Cặp ngoặc vuông [ ] gợi nhắc terminal CLI & tag Suno kẹp 3 cần fader phòng thu — sinh ra cho CLI tool + Global Skill.',
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><g stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M28 20 H16 V80 H28"/><path d="M72 20 H84 V80 H72"/></g><g stroke="currentColor" stroke-width="4.5" stroke-linecap="round"><line x1="36" y1="28" x2="36" y2="72"/><line x1="50" y1="28" x2="50" y2="72"/><line x1="64" y1="28" x2="64" y2="72"/></g><g fill="currentColor"><rect x="30" y="50" width="12" height="7" rx="3"/><rect x="44" y="34" width="12" height="7" rx="3"/><rect x="58" y="44" width="12" height="7" rx="3"/></g></svg>`
      },
      {
        id: 'v7-tuning-fork',
        name: 'V7 — Precision Fork',
        tag: 'Acoustic Accuracy',
        desc: 'Âm thoa chuẩn mực phát sóng âm cân bằng — biểu tượng cho sự chính xác của spec_adherence và pronunciation QC.',
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><g stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M22 30 C16 38 16 48 22 56" opacity="0.55"/><path d="M78 30 C84 38 84 48 78 56" opacity="0.55"/><path d="M14 23 C6 35 6 51 14 63" opacity="0.3"/><path d="M86 23 C94 35 94 51 86 63" opacity="0.3"/></g><g stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M36 20 V48 C36 58 64 58 64 48 V20"/><line x1="50" y1="56" x2="50" y2="84"/></g><circle cx="50" cy="84" r="5" fill="currentColor"/></svg>`
      },
      {
        id: 'v8-disc-execute',
        name: 'V8 — Disc Execute',
        tag: 'Studio Render',
        desc: 'Vòng cung đĩa nhạc cắt gọn bởi tam giác Play/Execute và nốt điểm nhấn — tối giản, mạnh mẽ ở kích thước lớn lẫn icon nhỏ.',
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><g stroke="currentColor" stroke-linecap="round"><path d="M50 14 A36 36 0 1 0 86 50" stroke-width="6.5"/><path d="M50 26 A24 24 0 1 0 74 50" stroke-width="4.5" opacity="0.7"/></g><polygon points="44,36 74,50 44,64" fill="currentColor"/><circle cx="76" cy="24" r="6" fill="currentColor"/></svg>`
      }
    ];

    let currentSize = 88;
    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = VARIANTS.map((v, i) => `
        <article class="card">
          <div class="card-head">
            <h2>${v.name}</h2>
            <span class="tag">${v.tag}</span>
          </div>
          <div class="preview-stage">
            <div class="main-icon" style="width:${currentSize}px;height:${currentSize}px;">${v.svg}</div>
          </div>
          <div class="lockup">${v.svg}<span>Music Director</span></div>
          <div class="size-strip">
            <span>Cỡ icon:</span>
            <div class="size-box" style="width:16px;height:16px;" title="16px taskbar/favicon">${v.svg}</div>
            <div class="size-box" style="width:24px;height:24px;" title="24px UI">${v.svg}</div>
            <div class="size-box" style="width:32px;height:32px;" title="32px Windows small icon">${v.svg}</div>
          </div>
          <p class="desc">${v.desc}</p>
          <div class="actions">
            <button onclick="copySvg(${i}, this)">Copy SVG</button>
            <button onclick="downloadSvg(${i})">Tải .svg</button>
          </div>
        </article>
      `).join('');
    }
    function setTheme(theme, btn) {
      document.body.className = theme === 'dark' ? '' : `theme-${theme}`;
      btn.parentElement.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    function setColor(hex, el) {
      document.documentElement.style.setProperty('--accent', hex);
      el.parentElement.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
    }
    function setMainSize(px, btn) {
      currentSize = px;
      btn.parentElement.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.main-icon').forEach(el => {
        el.style.width = px + 'px'; el.style.height = px + 'px';
      });
    }
    function copySvg(idx, btn) {
      navigator.clipboard.writeText(VARIANTS[idx].svg);
      const old = btn.textContent; btn.textContent = 'Đã copy!';
      setTimeout(() => btn.textContent = old, 1200);
    }
    function downloadSvg(idx) {
      const v = VARIANTS[idx];
      const blob = new Blob([v.svg], { type: 'image/svg+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `${v.id}.svg`; a.click();
    }
    render();
  </script>
</body>
</html>
